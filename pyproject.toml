[project]
name = "marketing-engineering"
version = "0.1.0"
description = "Catalog build and vote scripts for marketingengineering.dev"
requires-python = ">=3.12"
# scripts/ is stdlib only.
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["scripts"]

[tool.ruff]
line-length = 200

[tool.ruff.lint]
# ruff's defaults, pinned so a contributor's own ruff config can't change the result
select = ["E4", "E7", "E9", "F"]
