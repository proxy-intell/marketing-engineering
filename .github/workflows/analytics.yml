name: GitHub → PostHog

on:
  schedule:
    - cron: "41 3 * * *" # daily; GitHub keeps traffic for 14 days only
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/github_to_posthog.py
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_PROJECT_KEY }}
          POSTHOG_HOST: https://eu.i.posthog.com
