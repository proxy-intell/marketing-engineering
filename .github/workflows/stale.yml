name: Stale

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: 60
          days-before-close: 14
          # Tool suggestions wait for votes, not for replies.
          exempt-issue-labels: "suggestion,new-entry,approved,pinned"
          exempt-pr-labels: "pinned"
          stale-issue-message: "no activity for 60 days, so this is marked stale. it closes in 14 days unless someone replies."
          stale-pr-message: "no activity for 60 days, so this is marked stale. it closes in 14 days unless someone pushes or replies."
