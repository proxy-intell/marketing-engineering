name: Welcome

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ github.token }}
          issue-message: "First suggestion! Your screen time has officially become research. A maintainer will take a look soon."
          pr-message: "First PR! You've touched catalog.json, which counts as touching grass here. CI is checking your entry now."
