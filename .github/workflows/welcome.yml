name: Welcome

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ github.token }}
          issue-message: "first suggestion. your screen time is officially research now. a maintainer will look soon"
          pr-message: "first PR. touching catalog.json counts as touching grass here. CI is checking your entry now"
