name: Welcome

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greet:
    # Voter PRs (voters/README.md) merge on their own, no greeting.
    if: github.event_name == 'issues' || !startsWith(github.head_ref, 'vote-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo_token: ${{ github.token }}
          issue_message: "first suggestion. your screen time is officially research now. a maintainer will look soon"
          pr_message: "first PR. touching catalog.json counts as touching grass here. CI is checking your entry now"
