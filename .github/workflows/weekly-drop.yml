name: Weekly drop

on:
  schedule:
    - cron: "23 15 * * 5" # Fridays
  workflow_dispatch:

permissions:
  contents: write

jobs:
  drop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for votes.json at the last drop
      - name: Release notes, plus an email draft in Resend
        env:
          GH_TOKEN: ${{ github.token }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_SEGMENT_ID: ${{ vars.RESEND_SEGMENT_ID }}
          RESEND_FROM: ${{ vars.RESEND_FROM }}
          RESEND_REPLY_TO: ${{ secrets.RESEND_REPLY_TO }}
        run: |
          since=$(gh release list --limit 100 --json tagName --jq '[.[].tagName | select(startswith("drop-"))][0] // empty' | sed 's/^drop-//')
          since=${since:-1970-01-01}
          flags=""
          if [ -n "$RESEND_API_KEY" ] && [ -n "$RESEND_SEGMENT_ID" ] && [ -n "$RESEND_FROM" ]; then flags="--resend"; fi
          git show "drop-$since:votes.json" > "$RUNNER_TEMP/prev-votes.json" 2>/dev/null || rm -f "$RUNNER_TEMP/prev-votes.json"
          notes=$(python scripts/drop.py "$since" --prev-votes "$RUNNER_TEMP/prev-votes.json" $flags)
          if [ -z "$notes" ]; then echo "Nothing new since $since"; exit 0; fi
          today=$(date -u +%F)
          gh release create "drop-$today" --title "Weekly drop · $today" --notes "$notes"
