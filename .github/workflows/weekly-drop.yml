name: Weekly drop

on:
  schedule:
    - cron: "23 15 * * 5" # Fridays
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release for products added since the last drop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(gh release view --json tagName --jq .tagName 2>/dev/null | sed 's/^drop-//' || true)
          since=${since:-1970-01-01}
          notes=$(python scripts/drop.py "$since")
          if [ -z "$notes" ]; then echo "Nothing new since $since"; exit 0; fi
          today=$(date -u +%F)
          gh release create "drop-$today" --title "Weekly drop · $today" --notes "$notes"
