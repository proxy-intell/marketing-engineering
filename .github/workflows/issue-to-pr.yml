name: Suggestion → PR

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  open-pr:
    if: github.event.label.name == 'approved' && contains(github.event.issue.labels.*.name, 'suggestion')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install check-jsonschema==0.29.4
      - name: Add entry, regenerate, validate
        id: entry
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          slug=$(python scripts/issue_to_entry.py)
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          python scripts/build.py
          check-jsonschema --schemafile catalog.schema.json catalog.json
          python scripts/build.py --check
      - name: Open PR
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ steps.entry.outputs.slug }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          name=$(python -c "import json,os;print(next(p['name'] for p in json.load(open('catalog.json'))['products'] if p['slug']==os.environ['SLUG']))")
          branch="fresh-off-the-feed/$SLUG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add catalog.json categories.json README.md llms.txt .github/ISSUE_TEMPLATE/suggest-product.yml
          git commit -m "Add $name"
          git push -u origin "$branch"
          url=$(gh pr create --title "Add $name (fresh off the feed)" --body "Closes #$ISSUE. Generated from the suggestion form." --head "$branch")
          gh issue comment "$ISSUE" --body "Approved. PR is up: $url"
      - name: Report failure on the issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --body "The bot tripped on this one (see the Actions log). A maintainer will add it by hand."
